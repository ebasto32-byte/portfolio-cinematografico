<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Cinematográfico</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <a href="#" class="header__logo">Portofólio Cinematográfico</a>
    <nav class="header__nav">
      <a href="#inicio" class="header__link">Início</a>
      <a href="#galeria" class="header__link">Galeria</a>
    </nav>
  </header>

  <main>
    <!-- Hero Banner-->
    <section class="hero" id="inicio">
      <div class="hero__card">
      </div>
    </section>

    <!-- Carrossel -->
    <section class="marquee" id="comboio">
      <div class="marquee__track">
        <!-- Grupo 1 -->
        <div class="marquee__group">
          <div class="marquee__item"><img class="marquee__img" src="fotos/foto5.JPG"></div>
          <div class="marquee__item"><img class="marquee__img" src="fotos/14.JPG"></div>
          <div class="marquee__item"><img class="marquee__img" src="fotos/20.JPG"></div>
          <div class="marquee__item"><img class="marquee__img" src="fotos/foto8.JPG"></div>
        </div>
        <!-- Grupo 2 (Duplicado) -->
        <div class="marquee__group" aria-hidden="true">
          <div class="marquee__item"><img class="marquee__img" src="fotos/foto5.JPG"></div>
          <div class="marquee__item"><img class="marquee__img" src="fotos/14.JPG"></div>
          <div class="marquee__item"><img class="marquee__img" src="fotos/20.JPG"></div>
          <div class="marquee__item"><img class="marquee__img" src="fotos/foto8.JPG"></div>
        </div>
      </div>
    </section>

    <!-- Galeria Principal -->
    <section class="gallery-section" id="galeria">
      <h2 class="gallery-section__title">Galeria Cinematográfica</h2>
      
      <div class="gallery">
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto1.JPG" alt="1"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto2.JPG" alt="2"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto3.JPG" alt="3"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto4.JPG" alt="4"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto5.JPG" alt="5"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto6.JPG" alt="6"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto7.JPG" alt="7"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto8.JPG" alt="8"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto10.JPG" alt="9"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto9.JPG" alt="10"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto12.JPG" alt="11"></div>
        <div class="gallery__item"><img class="gallery__img" src="fotos/foto13.JPG" alt="12"></div>
      </div>
    </section>
  </main>

  <!-- Lightbox-->
  <div id="lightbox" class="lightbox">
    <span class="lightbox__close">&times;</span>
    <img id="lightbox-img" class="lightbox__img" src="" alt="Zoom">
  </div>

  <script src="script.js"></script>
</body>
</html>
